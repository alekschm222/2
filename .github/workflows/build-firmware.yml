name: Build Xiaozhi Vietnam firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Отключаем -Werror=format только для компонента main,
      # чтобы сборка не падала на несоответствии %d и int32_t.
      - name: Patch main/CMakeLists.txt (-Wno-error=format)
        run: |
          if [ -f main/CMakeLists.txt ]; then
            grep -q "Wno-error=format" main/CMakeLists.txt || \
              printf '\ntarget_compile_options(${COMPONENT_LIB} PRIVATE -Wno-error=format)\n' >> main/CMakeLists.txt
            echo "----- main/CMakeLists.txt (tail) -----"
            tail -n 10 main/CMakeLists.txt
          else
            echo "main/CMakeLists.txt not found!" && exit 1
          fi

      # Подменяем V4L2_PIX_FMT_RGB565 на старый API JPEG_PIXEL_FORMAT_RGB565,
      # который есть в esp_new_jpeg 0.6.1 (в проекте тянется именно она).
      - name:       - name: Patch V4L2_PIX_FMT_RGB565 alias (main + managed_components)
        run: |
          FILES=$(grep -rl "V4L2_PIX_FMT_RGB565" main/ managed_components/ 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No files use V4L2_PIX_FMT_RGB565, nothing to patch"
            exit 0
          fi
          for f in $FILES; do
            echo "Patching $f"
            if ! grep -q 'esp_jpeg_dec.h' "$f"; then
              sed -i '1i #include "esp_jpeg_dec.h"' "$f"
            fi
            if ! grep -q '#define V4L2_PIX_FMT_RGB565' "$f"; then
              sed -i '1i #ifndef V4L2_PIX_FMT_RGB565\n#define V4L2_PIX_FMT_RGB565 JPEG_PIXEL_FORMAT_RGB565\n#endif\n' "$f"
            fi
            head -n 6 "$f"
          done

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: .
          command: "rm -f managed_components/espressif__esp_cam_sensor/sdkconfig.rename && idf.py build"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-vietnam-firmware
          path: |
            build/*.bin
            build/**/*.bin
            build/partition_table/*.bin
            build/bootloader/*.bin
          if-no-files-found: warn
